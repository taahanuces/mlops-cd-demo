name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      git_commit: ${{ steps.meta.outputs.git_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version and commit
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_commit=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --build-arg APPLICATION_VERSION=${{ steps.meta.outputs.version }} \
            --build-arg MODEL_VERSION=model-7 \
            --build-arg GIT_COMMIT=${{ steps.meta.outputs.git_commit }} \
            -t ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }} \
            -t ghcr.io/${{ github.repository }}:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
          docker push ghcr.io/${{ github.repository }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Smoke test staging
        run: |
          sleep 5
          curl --fail http://${{ secrets.STAGING_HOST }}:5000/health

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}
            docker stop mlops-api || true
            docker rm mlops-api || true
            docker run -d \
              --name mlops-api \
              --restart unless-stopped \
              -p 5000:5000 \
              ghcr.io/${{ github.repository }}:${{ needs.build.outputs.version }}

      - name: Smoke test production
        run: |
          sleep 5
          curl --fail http://${{ secrets.PRODUCTION_HOST }}:5000/health
